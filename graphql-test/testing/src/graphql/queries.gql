query AD_OrgInfoGet($page: Int, $size: Int, $sort: String, $filter: String) {
	AD_OrgInfoGet(page: $page, size: $size, sort: $sort, filter: $filter) {
		results {
			C_Location {
				C_Country {
					UUID
				}
				C_Region {
					UUID
					Name
				}
				UUID
			}
			UUID
		}
	}
}

