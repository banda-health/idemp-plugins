query C_ChargeGet($page: Int, $size: Int, $sort: String, $filter: String) {
	C_ChargeGet(page: $page, size: $size, sort: $sort, filter: $filter) {
		results {
			UUID
			Name
			C_Charge_AcctList {
				UUID
				Ch_Expense_A {
					UUID
					Account {
						UUID
						Value
					}
				}
			}
			C_ChargeType {
				UUID
			}
		}
	}
}

