query AD_ClientGet($Page: Int, $Size: Int, $Sort: String, $Filter: String) {
	AD_ClientGet(Page: $Page, Size: $Size, Sort: $Sort, Filter: $Filter) {
		Results {
			UU
			Name
			AD_Orgs {
				UU
				Name
				AD_Roles {
					UU
					Name
				}
				M_Warehouses {
					UU
					Name
					BH_DefaultWarehouse
					IsActive
					M_Locators {
						UU
					}
				}
			}
		}
	}
}

