query SignIn($credentials: AuthenticationInput!) {
	signIn(credentials: $credentials) {
		token
		AD_Clients {
			UUID
			Name
			AD_Orgs {
				UUID
				Name
				AD_Roles {
					UUID
					Name
				}
				M_Warehouses {
					UUID
					Name
					BH_DefaultWarehouse
					IsActive
					M_Locators {
						UUID
					}
				}
			}
		}
		AD_Role {
			IncludedRoles {
				UUID
			}
			AD_Window_AccessList {
				AD_Window {
					UUID
				}
				BH_CanDeactivate
				IsReadWrite
			}
		}
	}
}
