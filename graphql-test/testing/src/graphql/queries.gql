query AD_RoleLocationPriceListsCurrencyGet(
	$AD_RoleFilter: String
	$C_LocationFilter: String
	$M_PriceListFilter: String
) {
	AD_RoleGet(Filter: $AD_RoleFilter) {
		Results {
			...AD_RoleFields
			AD_Window_AccessList {
				AD_Window {
					UU
				}
				BH_CanDeactivate
				IsReadWrite
			}
		}
	}
	C_LocationGet(Filter: $C_LocationFilter) {
		Results {
			...C_LocationFields
		}
	}
	M_PriceListGet(Filter: $M_PriceListFilter) {
		Results {
			UU
			Created
			IsSOPriceList
		}
	}
	C_AcctSchemaGet {
		Results {
			UU
			C_Currency {
				UU
			}
		}
	}
}

