query AD_MenuGet($Page: Int, $Size: Int, $Sort: String, $Filter: String) {
	AD_MenuGet(Page: $Page, Size: $Size, Sort: $Sort, Filter: $Filter) {
		Results {
			ChildrenTree_NodeMMList {
				Node {
					Name
					ChildrenTree_NodeMMList {
						Node {
							Name
							AD_Process {
								UU
								Name
							}
							AD_Window {
								UU
								Name
							}
						}
						SeqNo
					}
					AD_Process {
						UU
						Name
					}
					AD_Window {
						UU
						Name
					}
					UU
				}
				SeqNo
			}
		}
	}
}

