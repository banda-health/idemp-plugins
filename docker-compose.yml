services:
  idempiere:
    image: ghcr.io/banda-health/banda-idempiere:${IDEMPIERE_VERSION}
    depends_on:
      - postgres
    volumes:
      - ./testing:${INSTALLATION_HOME}
      - ./idempiere-logs/${CONTAINER_NAME}:/opt/idempiere/log
    container_name: '${CONTAINER_NAME}_idempiere'
    environment:
      - DB_ADMIN_PASS=${POSTGRES_PASSWORD}
      - DB_HOST=${POSTGRES_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASS=${IDEMPIERE_DATABASE_PASSWORD}
      - DB_PORT=${POSTGRES_PORT}
      - IDEMPIERE_FRESH_DB=${IDEMPIERE_FRESH_DB}
      - IDEMPIERE_VERSION=${IDEMPIERE_VERSION}
      - MIGRATE_EXISTING_DATABASE=${MIGRATE_EXISTING_DATABASE}
      - GENERATE_PLUGIN_BUNDLE_INFO=${GENERATE_PLUGIN_BUNDLE_INFO}
      - HEALTHY_AFTER_PLUGINS_START=${HEALTHY_AFTER_PLUGINS_START}
      - INSTALLATION_HOME=${INSTALLATION_HOME}
      - OCL_API_TOKEN=whatever
      - OCL_BASE_URL=http://external-mocks:${EXTERNAL_MOCKS_PORT}/ocl
      - GRAPHQL_PROXY_UPSTREAM_URL=http://external-mocks:${EXTERNAL_MOCKS_PORT}/graphql-proxy
    ports:
      - ${IDEMPIERE_PORT}:8080
      - ${IDEMPIERE_SSL_PORT}:8443
      - ${TELNET_PORT}:12612

  external-mocks:
    build:
      context: ./external-mocks
    volumes:
      - ./external-mocks:/app
      - /app/node_modules
    container_name: '${CONTAINER_NAME}_external_mocks'
    environment:
      - PORT=${EXTERNAL_MOCKS_PORT}

  tests:
    build: .
    restart: "no"
    depends_on:
      idempiere:
        condition: service_healthy
      external-mocks:
        condition: service_started
    volumes:
      - ./db-output:/app/output
    container_name: '${CONTAINER_NAME}_tests'
    environment:
      - CI=${CI:-false}
      - TEST_QUIET=${TEST_QUIET:-true}
      - IDEMPIERE_ENDPOINT=${IDEMPIERE_ENDPOINT}
      - IDEMPIERE_GRAPHQL_TEST_CLIENT=${IDEMPIERE_GRAPHQL_TEST_CLIENT}
      - IDEMPIERE_USER=${IDEMPIERE_USER}
      - IDEMPIERE_USER_PASSWORD=${IDEMPIERE_USER_PASSWORD}
      - PGHOST=${POSTGRES_HOST}
      - PGPORT=${POSTGRES_PORT}
      - PGDATABASE=${DB_NAME}
      - PGUSER=adempiere
      - PGPASSWORD=${IDEMPIERE_DATABASE_PASSWORD}

  postgres:
    image: postgres:16
    container_name: '${CONTAINER_NAME}_postgres'
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPORT=${POSTGRES_PORT}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
